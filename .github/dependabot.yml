version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: monday
      time: "02:00"
  - package-ecosystem: "nix"
    directory: "/"
    schedule:
      interval: "daily"
      time: "02:00"
    groups:
      daily-updates:
        applies-to: version-updates
        patterns:
          - "*"
